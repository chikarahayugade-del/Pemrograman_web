<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan 10 - Menu Dropdown</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .menu-btn {
            padding: 5px 15px;
            cursor: pointer;
        }

        .menu-list {
            display: none;
            margin-top: 4px;
            width: fit-content;
        }

        .menu-item {
            display: block;
            padding: 6px 25px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            text-align: center;
            font-size: 14px;
        }

        .menu-item:hover {
            background-color: #e2e2e2;
        }
    </style>
</head>

<body>

    <button class="menu-btn" id="btnMenu">menu</button>

    <div class="menu-list" id="menuDropdown">
        <div class="menu-item">menu 1</div>
        <div class="menu-item">menu 2</div>
        <div class="menu-item">menu 3</div>
    </div>

    <script>
        const button = document.getElementById("btnMenu");
        const dropdown = document.getElementById("menuDropdown");

        button.addEventListener("click", function () {
            dropdown.style.display =
                dropdown.style.display === "block" ? "none" : "block";
        });
    </script>

</body>
</html>
