<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Konversi Suhu</title>
    <style>
        body {
            font-family: serif;
            padding: 20px;
        }
        input {
            margin-bottom: 10px;
        }
        #output {
            font-size: 1.1em;
        }
    </style>
</head>
<body>

<h2>Konversi Suhu</h2>

<div>
    <label>Celcius</label>
    <input type="number" id="nilaiCelcius" placeholder="Celcius">
</div>

<div id="output">Fahrenheit</div>

<script>
    const input = document.getElementById("nilaiCelcius");
    const output = document.getElementById("output");

    input.addEventListener("input", function () {
        let c = input.value;

        if (c !== "") {
            let f = (Number(c) * 9 / 5) + 32;
            output.innerHTML = "Fahrenheit <b>" + f + "</b>";
        } else {
            output.innerHTML = "Fahrenheit";
        }
    });
</script>

</body>
</html>
